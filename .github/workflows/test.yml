# Runs the test suite on every push to main. It does not deploy: deploying is a
# deliberate act here, done from a machine that is logged in to Fly.
#
#   ./scripts/deploy.sh
#
# To hand deploys back to CI, add a deploy token as the repository secret
# FLY_API_TOKEN (Settings → Secrets and variables → Actions) and append:
#
#   deploy:
#     name: Deploy
#     needs: test
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#       - uses: superfly/flyctl-actions/setup-flyctl@master
#       - run: flyctl deploy --remote-only --ha=false --strategy rolling
#         env:
#           FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
#
# Generate the token with:  fly tokens create deploy -a study1-survey

name: Test

# Manual only. Running on every push meant a failure e-mail for each one, and
# the failures were the runner rather than the code: `playwright install
# --with-deps` shells out to apt, which took five minutes on a good day and
# hung indefinitely on a bad one. Deploying does not depend on this, so it is
# now something you ask for.
#
#   Actions -> Test -> Run workflow
#
# Or locally, which takes about a minute and needs no runner. The base URL is
# a positional argument, and it can be the deployed study — the walk runs with
# ?test=1, so its row is flagged as test data and gives its slot back:
#
#   npm install --no-save playwright && npx playwright install chromium
#   node scripts/browser-test.mjs https://study1-survey.fly.dev
#
# To put it back on every push, restore:
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

concurrency:
  group: test
  cancel-in-progress: true   # a superseded run tells you nothing useful

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study1
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/study1?sslmode=disable
          ADMIN_TOKEN: ci-token-0123456789abcdefghijkl
          IP_SALT: ci-salt
          PORT: "8099"
          SESSION_START_RATE_MAX: "100000"
          RATE_LIMIT_MAX: "100000"
        run: |
          node src/server.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 1; done
      - name: Simulated participants
        run: node scripts/simulate.mjs --n 60 --conc 15
      - name: Cache the browser
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Browser test
        # --with-deps shells out to apt, which is what used to take five minutes
        # and sometimes never returned. ubuntu-latest already carries what the
        # headless shell needs, and the download itself is cached above.
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node scripts/browser-test.mjs
        timeout-minutes: 10
